port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
proxies:
  - name: "👨‍💻 自建ws"
    type: vless
    server: seed-hk.com
    port: 8443
    uuid: 5dd32b62-dfac-40e1-8d3e-d87dba6f82ac
    udp: true
    tls: true                  
    skip-cert-verify: true  
    servername: seed-hk.com
    network: grpc
    grpc-opts:
      grpc-service-name: "speed-grpc-x79w2k"
  - name: "🛸 自建hy"
    type: hysteria2
    server: seed-hk.com
    port: 50000
    password: seed_node_hysteria-x79w2k
    up: "20 Mbps"
    down: "80 Mbps"
    sni: seed-hk.com
    skip-cert-verify: true     # 跳过严格证书验证
    alpn:
      - h3                    
    obfs: salamander  
    obfs-password: seed_node_hysteria-x79w2k      
#      
proxy-providers:
  airport:
    type: http
    url: "https://gbshct.spphhnhg.top/link2/4djUxrOL7Y2scIPOnhSSD7esChZkdjV8" 
    interval: 86400
    path: ./airport.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
#
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - 🛸 自建hy
      - 👨‍💻 自建ws
      - 💿 视频节点
      - 🇭🇰 香港节点
      - 🌏 亚洲节点
      - 🇺🇲 美国节点
      - 🇨🇳 台湾节点
      - 🌎 其它节点
  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use: [airport]
  - name: 🌍 国外媒体
    type: select
    proxies:
      - 🛸 自建hy
      - 👨‍💻 自建ws
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
  - name: 🍀 谷歌FCM
    type: select
    proxies:
      - 🛸 自建hy
      - 👨‍💻 自建ws
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🛸 自建hy
      - 👨‍💻 自建ws
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT 
  - name: 💿 视频节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use: [airport]  
  - name: 🇭🇰 香港节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50   
    use: [airport]
    filter: "HK|hk|香港|港|HongKong"
  - name: 🌏 亚洲节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use: [airport]    
    filter: "日本|东京|大阪|埼玉|[^-]日|JP|Japan|韩国|新加坡"
  - name: 🇨🇳 台湾节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50   
    use: [airport]
    filter: "台湾|Taiwan"
  - name: 🇺🇲 美国节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use: [airport]    
    filter: "美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States"
  - name: 🌎 其它节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use: [airport]    
    filter: "印|英|德国|荷|巴|阿|澳|沙" 
